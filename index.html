<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>融与蚀：时间的空间 | 开启麻醉</title>
    <style>
        :root {
            --bg-color: #050607;
            --border-color: rgba(57, 255, 20, 0.3);
            --glow-color: #39ff14;
            --text-primary: #e0e4eb;
            --text-secondary: #7f8999;
            --font-mono: 'Courier New', Courier, monospace, "Microsoft YaHei";
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, var(--font-mono);
            overflow: hidden;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 1. 麻醉启动前奏遮罩 */
        #onboarding {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .onboarding-dialog {
            max-width: 540px;
            width: 100%;
            text-align: center;
            border: 1px solid var(--border-color);
            padding: 3.5rem 2.5rem;
            background: rgba(14, 16, 20, 0.95);
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(57, 255, 20, 0.05);
            transition: all 0.3s ease;
        }

        .onboarding-quote {
            font-size: 1.2rem;
            line-height: 1.95;
            margin-bottom: 3rem;
            color: #fff;
            letter-spacing: 0.12rem;
            text-align: justify;
        }

        .onboarding-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            line-height: 1.7;
            letter-spacing: 1px;
        }

        .btn-anesthesia {
            background: transparent;
            border: 1px solid var(--glow-color);
            color: var(--glow-color);
            padding: 1.1rem 2.5rem;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.15rem;
            transition: all 0.3s ease;
            font-family: var(--font-mono);
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
            display: block;
            outline: none;
        }

        .btn-anesthesia:hover {
            background: rgba(57, 255, 20, 0.12);
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- 1. 麻醉启动前奏遮罩 -->
    <div id="onboarding">
        <div class="onboarding-dialog">
            <div class="onboarding-quote">
                “麻醉的过程里，请您想一样让自己着迷的东西。”医生说道，“想得越细致越好。这将有利于芯片和脑神经快速融合链接。”
            </div>
            <div class="onboarding-desc">
                * 本页面需要开启声音。您即将被植入脑部芯片，深呼吸，放空自己，让我们的感官与代码共同振荡。 *
            </div>
            <button class="btn-anesthesia" onclick="enterJourney()">开始麻醉<br>(START)</button>
        </div>
    </div>

    <!-- JS 跳转逻辑 -->
    <script>
        function enterJourney() {
            // 点击开始麻醉瞬间顺畅跳转至 index2.html
            window.location.href = 'index2.html';
        }
    </script>
</body>
</html>
